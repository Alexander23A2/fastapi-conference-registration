<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференція 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">ZNU Conf 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    {% if user %}
                        <li class="nav-item"><a class="nav-link" href="/dashboard">Список учасників</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="/logout">Вийти ({{ user.first_name }})</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login">Вхід</a></li>
                        <li class="nav-item"><a class="nav-link" href="/register">Реєстрація</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
